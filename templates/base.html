<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}ЛР 1. Изменение контраста{% endblock %}</title>
    <!-- Bootstrap подключаем с CDN, чтобы не верстать стили вручную -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link href="{{ url_for('static', filename='styles.css') }}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('hello') }}">Веб-сервисы · ЛР 1</a>
        <a class="nav-link text-white" href="{{ url_for('contrast') }}">Изменить контраст</a>
    </div>
</nav>
<main class="container mb-5">
    {% block content %}{% endblock %}
</main>
</body>
</html>
